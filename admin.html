/* =========================================================================
   THE GATE

   Front-of-house only. The check runs in the browser, so anyone who opens
   the page source can read the credentials below. It keeps the page out of
   casual reach; it is not security.

   This has to move server-side before it manages real members, because at
   that point it is guarding other people's data rather than your own draft
   articles. The accounts build plan covers it.
   ========================================================================= */

/* Two modes. Connected: sign in with the Supabase account whose profile has
   is_admin set, and every request carries that session token which the
   server verifies. Not connected: the demo password, which is fine while it
   guards your own drafts and unacceptable once it guards members. */

const ADMIN_USER = "tom.rogers";
const ADMIN_PASS = "3333";

let ADMIN_SESSION = null;

function unlock(){
  document.getElementById('gate').hidden = true;
  document.getElementById('admin').hidden = false;
  document.getElementById('whoami').innerHTML = ADMIN_SESSION
    ? ADMIN_SESSION.email
    : '<b class="warnpill">Not connected</b> config.js still has placeholder values';
  try { sessionStorage.setItem('sr-adminarea','1'); } catch(e){}
  render();
}

document.getElementById('gateform').addEventListener('submit', async e => {
  e.preventDefault();
  const u = document.getElementById('au').value.trim();
  const p = document.getElementById('ap').value.trim();
  const err = document.getElementById('aerr');

  if(accountsLive()){
    try {
      await signIn(u, p);
      const profile = await getProfile();
      if(!profile || !profile.is_admin){
        await signOut();
        err.textContent = 'That account is not an administrator.';
        err.hidden = false;
        return;
      }
      ADMIN_SESSION = { email: profile.email, id: profile.id };
      unlock();
    } catch(ex){
      err.textContent = 'Those details were not recognised.';
      err.hidden = false;
    }
    return;
  }

  if(u.toLowerCase() === ADMIN_USER && p === ADMIN_PASS) unlock();
  else { err.textContent = 'Not recognised.'; err.hidden = false; }
});

/* Signed calls to the admin endpoints. */
/* Returns the data, or an object with .failed explaining why. Swallowing the
   reason and showing "could not load" turns a one-line fix into an hour of
   guessing. */
async function adminFetch(what){
  if(!accountsLive()) return { failed: 'Accounts are not connected, config.js still has placeholders.' };

  const c = sbClient();
  const { data } = await c.auth.getSession();
  if(!data || !data.session) return { failed: 'Your session has expired. Sign in again.' };

  let res;
  try {
    res = await fetch('/api/admin-data?what=' + what, {
      headers: { 'Authorization': 'Bearer ' + data.session.access_token }
    });
  } catch(e){
    return { failed: 'Could not reach /api/admin-data. Is the api folder deployed?' };
  }

  if(res.status === 404){
    return { failed: 'The endpoint /api/admin-data does not exist. ' +
      'Check admin-data.js is inside the api folder in your repo, and that the last deploy was green.' };
  }

  let out = null;
  try { out = await res.json(); } catch(e){}

  if(!res.ok){
    return { failed: (out && out.error) || ('The server returned ' + res.status + '.'),
             missing: out && out.missing };
  }
  return out;
}

async function adminAction(body){
  const c = sbClient();
  const { data } = await c.auth.getSession();
  const res = await fetch('/api/admin-action', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + data.session.access_token },
    body: JSON.stringify(body)
  });
  return res.json();
}

['au','ap'].forEach(id => document.getElementById(id)
  .addEventListener('input', () => { document.getElementById('aerr').hidden = true; }));

document.getElementById('apeek').addEventListener('click', () => {
  const p = document.getElementById('ap'), shown = p.type === 'text';
  p.type = shown ? 'password' : 'text';
  document.getElementById('apeek').textContent = shown ? 'Show' : 'Hide';
  p.focus();
});

document.getElementById('signout').addEventListener('click', async () => {
  try { sessionStorage.removeItem('sr-adminarea'); } catch(e){}
  if(accountsLive()) await signOut();
  location.reload();
});

/* Say plainly which mode this is, so "demo" is never a mystery. */
(function(){

  note.innerHTML = accountsLive()
    ? '<div class="okbox" style="margin-bottom:18px;font-size:13px"><b>Connected.</b> ' +
      'Sign in with the account you made an administrator.</div>'
    : '<div class="notice" style="margin-top:0;margin-bottom:18px;font-size:13px"><b>Not connected.</b> ' +
      '<code>config.js</code> still has placeholder values, so there is no database to read. ' +
      'The fallback password works and the import tools work, but Members, Traffic and Email will be empty. ' +
      'Fill in your Supabase URL and anon key to switch this on.</div>';
})();

try { if(sessionStorage.getItem('sr-adminarea') === '1') unlock(); } catch(e){}

/* =========================================================================

   ========================================================================= */

let view = 'overview';

function render(){
  const p = document.getElementById('apanel');
  if(view === 'overview'){ p.innerHTML = overviewView(); loadTraffic(p); loadSearches(); }
  if(view === 'members'){ p.innerHTML = membersView(); loadMembers(p); }
  if(view === 'content'){ p.innerHTML = contentView(); wireRemove(p); }
  if(view === 'email'){   p.innerHTML = emailView(); loadEmails(); }
  if(view === 'brand'){   p.innerHTML = brandView();  wireBrand(p); }
  if(view === 'write'){   p.innerHTML = writeView(); wireWrite(p); }
  if(view === 'import')   renderImportTool(p);
  window.scrollTo({ top:0, behavior:'smooth' });
}

document.querySelectorAll('#atabs button').forEach(b =>

    document.querySelectorAll('#atabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    view = b.dataset.view;
    render();
  }));

    '<div class="mgrid">' +
      '<div class="mcard"><div class="n">' + STANDARDS.length.toLocaleString('en-GB') + '</div><div class="l">Standards tracked</div></div>' +
      '<div class="mcard warm"><div class="n">' + feed.length + '</div><div class="l">Items in the feed</div></div>' +
      '<div class="mcard cool"><div class="n">' + arts.length + '</div><div class="l">Articles live</div></div>' +
      '<div class="mcard"><div class="n">' + written + '</div><div class="l">Written by hand</div></div>' +
    '</div>' +

    '<div class="grouphead"><h2>Data freshness</h2><div class="rule"></div></div>' +
    '<table class="std levytable"><tbody>' +
      row('Written content', typeof DATA_UPDATED !== 'undefined' ? fmtLong(DATA_UPDATED) : 'unknown',
          'DATA_UPDATED in data.js, set it by hand when you edit content') +
      row('Standards register', typeof STANDARDS_UPDATED !== 'undefined' ? fmtLong(STANDARDS_UPDATED) : 'not stamped',
          'Set by the importer and the weekly sync') +
      row('Occupational maps', typeof OCCUPATIONS_UPDATED !== 'undefined' ? fmtLong(OCCUPATIONS_UPDATED) : 'not yet synced',
          typeof OCCUPATIONS !== 'undefined' ? Object.keys(OCCUPATIONS).length + ' occupations' : 'run /api/sync-occupations') +
      row('Off-the-job minimums', typeof OTJ_SOURCE !== 'undefined' ? OTJ_SOURCE.count + ' standards' : 'not loaded',
          typeof OTJ_SOURCE !== 'undefined' ? OTJ_SOURCE.name : '') +
    '</tbody></table>' +

    '<div class="grouphead"><h2>Traffic</h2><div class="rule"></div></div>' +

    '<div class="notice" style="margin-top:0"><b>Two sources, and they count different things.</b> ' +
    'The figures below come from this site\'s own <code>page_views</code> table, every page load, no cookies, ' +
    'no identifiers. <b>Vercel Web Analytics</b> runs alongside it and gives visitors rather than views, plus ' +
    'devices, countries and referrers. Its data cannot be read from here, because Vercel does not expose it to ' +
    'a page, so it lives in your Vercel dashboard.</div>' +

    '<div class="addrow" style="margin:14px 0 18px">' +
      '<a class="btn small" href="https://vercel.com/dashboard" target="_blank" rel="noopener" style="text-decoration:none">Open Vercel Analytics &nearr;</a>' +
      '<a class="btn small ghost" href="https://search.google.com/search-console" target="_blank" rel="noopener" style="text-decoration:none">Search Console &nearr;</a>' +
      '<span class="hint" style="align-self:center;margin:0">Analytics → your project. Enable it once in the dashboard if you have not.</span>' +
    '</div>' +

    '<div id="traffic"></div>' +
    '<div class="grouphead"><h2>What people search for</h2><div class="rule"></div></div>' +
    '<div id="searches"><p class="hint">Loading…</p></div>' +
    '';
}

/* Searches are the most useful thing collected: people telling you, in their
   own words, what they expected to find. A term that comes up repeatedly and
   returns nothing is a gap worth filling. */
async function loadSearches(){
  const el = document.getElementById('searches');
  if(!el) return;
  if(!accountsLive()){ el.innerHTML = '<p class="hint">Available once Supabase is connected.</p>'; return; }

  const out = await adminFetch('searches');
  if(!out || out.failed || !out.terms){ el.innerHTML = failureHTML(out, 'searches'); return; }
  if(!out.terms.length){ el.innerHTML = '<p class="hint">Nothing recorded yet.</p>'; return; }

  el.innerHTML = '<table class="std"><thead><tr><th>Term</th><th>Searches</th><th>Last used</th></tr></thead><tbody>' +
    out.terms.map(t => '<tr><td class="nm">' + t.term + '</td><td class="num">' + t.searches + '</td>' +
      '<td class="num">' + fmtLong(t.last_searched) + '</td></tr>').join('') +
    '</tbody></table>';
}

async function loadTraffic(panel){
  const el = document.getElementById('traffic');
  if(!el) return;
  if(!accountsLive()){
    el.innerHTML = '<p class="hint">Page views are recorded once Supabase is connected. No cookies, no identifiers, path and day only.</p>';
    return;
  }
  const out = await adminFetch('traffic');
  if(!out || out.failed || !out.paths){ el.innerHTML = failureHTML(out, 'traffic'); return; }

  el.innerHTML =
    '<div class="mgrid" style="margin-top:0">' +
      '<div class="mcard"><div class="n">' + out.total.toLocaleString('en-GB') + '</div><div class="l">Views, last 30 days</div></div>' +
      '<div class="mcard cool"><div class="n">' + out.days.length + '</div><div class="l">Days with traffic</div></div>' +
      '<div class="mcard warm"><div class="n">' + out.paths.length + '</div><div class="l">Pages visited</div></div>' +
      '<div class="mcard"><div class="n">' + out.referrers.length + '</div><div class="l">Referring sites</div></div>' +
    '</div>' +
    (out.paths.length
      ? '<table class="std" style="margin-top:12px"><thead><tr><th>Page</th><th>Views</th></tr></thead><tbody>' +
        out.paths.slice(0,12).map(p => '<tr><td class="nm">' + p[0] + '</td><td class="num">' + p[1] + '</td></tr>').join('') +
        '</tbody></table>' : '<p class="hint">Nothing recorded yet.</p>') +
    (out.referrers.length
      ? '<div class="grouphead"><h2>Where they came from</h2><div class="rule"></div></div>' +
        '<table class="std"><tbody>' + out.referrers.map(r =>
          '<tr><td class="nm">' + r[0] + '</td><td class="num">' + r[1] + '</td></tr>').join('') + '</tbody></table>'
      : '');
}

function row(a, b, c){
  return '<tr><td class="nm">' + a + '</td><td class="num big">' + b + '</td><td>' + c + '</td></tr>';
}

/* A failure worth reading, with the fix attached where we know it. */
function failureHTML(out, what){
  const why = (out && out.failed) || 'No response from the server.';
  const missing = out && out.missing;

  return '<div class="alert"><b>Could not load ' + what + '.</b><br>' + why + '</div>' +
    (missing
      ? '<div class="notice" style="margin-top:14px"><b>How to fix this.</b> ' +
        'In Vercel, open <b>Settings &rarr; Environment Variables</b> and add <code>' + missing + '</code>, ' +
        'ticked for Production. ' +
        (missing === 'SUPABASE_SERVICE_KEY'
          ? 'Its value is in Supabase under <b>Settings &rarr; API</b>, labelled <b>service_role</b>. ' +
            'That key bypasses every security rule, so it belongs in Vercel only, never in config.js.'
          : 'Its value is in Supabase under <b>Settings &rarr; API</b>.') +
        ' Then <b>redeploy</b>, variables only take effect on a new deployment.</div>'
      : '<div class="notice" style="margin-top:14px"><b>Most likely causes.</b> ' +
        'The three Supabase variables are not set in Vercel yet ' +
        '(<code>SUPABASE_URL</code>, <code>SUPABASE_ANON_KEY</code>, <code>SUPABASE_SERVICE_KEY</code>), ' +
        'or you added them without redeploying. Step 7 of the go-live guide covers it.</div>');
}

/* ---------- Members ---------- */

function membersView(){
  if(!accountsLive()){
    return '<div class="pagehead"><h1>Members</h1><p>Not connected yet.</p></div>' +
      '<div class="notice" style="margin-top:0"><b>No member list because there are no members.</b> ' +
      '<code>config.js</code> still has placeholder values. Once Supabase is connected this page reads the real list.</div>' +
      whatGoesHere();
  }

  return '<div class="pagehead"><h1>Members</h1>' +
    '<p>Everyone signed up, with their subscription status.</p></div>' +
    '<div id="memberlist"><p class="hint">Loading…</p></div>';
}

async function loadMembers(panel){
  if(!accountsLive()) return;
  const out = await adminFetch('members');
  const el = document.getElementById('memberlist');
  if(!el) return;

  if(!out || out.failed || !out.members){
    el.innerHTML = failureHTML(out, 'the member list');
    return;
  }

  const m = out.members;
  const paying = m.filter(x => ['active','trialing'].indexOf(x.subscription.status) > -1).length;
  const lapsed = m.filter(x => ['past_due','canceled'].indexOf(x.subscription.status) > -1).length;

  el.innerHTML =
    '<div class="mgrid">' +
      '<div class="mcard"><div class="n">' + m.length + '</div><div class="l">Accounts</div></div>' +
      '<div class="mcard cool"><div class="n">' + paying + '</div><div class="l">Paying</div></div>' +
      '<div class="mcard warm"><div class="n">' + lapsed + '</div><div class="l">Lapsed or failing</div></div>' +
      '<div class="mcard"><div class="n">' + m.filter(x => x.email_opt_out).length + '</div><div class="l">Opted out of email</div></div>' +
    '</div>' +

    '<div class="grouphead"><h2>All members</h2><div class="rule"></div></div>' +
    '<table class="std"><thead><tr><th>Member</th><th>Joined</th><th>Status</th><th>Email</th><th></th></tr></thead><tbody>' +
    m.map(x => '<tr>' +
      '<td class="nm">' + (x.org_name || ',') + '<small>' + x.email + (x.is_admin ? ' · admin' : '') + '</small></td>' +
      '<td class="num">' + fmtLong(x.created_at.slice(0,10)) + '</td>' +
      '<td>' + statusTag(x.subscription) + '</td>' +
      '<td>' + (x.email_opt_out ? '<span class="chg none">opted out</span>' : '<span class="chg yes">yes</span>') + '</td>' +
      '<td class="num">' +
        '<button class="linkbtn" data-comp="' + x.id + '" data-em="' + x.email + '">' +
          (['active','trialing'].indexOf(x.subscription.status) > -1 ? 'Revoke' : 'Grant free') + '</button> ' +
        '<button class="linkbtn" data-reset="' + x.email + '" data-uid="' + x.id + '">Reset</button> ' +
        '<button class="linkbtn" data-export="' + x.id + '">Export</button> ' +
        '<button class="linkbtn" data-del="' + x.id + '" data-em="' + x.email + '">Delete</button>' +
      '</td></tr>').join('') +
    '</tbody></table>' +
    '<div id="actionout"></div>';

  wireMemberActions(el);
}

function statusTag(s){
  const map = { active:'new', trialing:'new', past_due:'warn', canceled:'stop', none:'info' };
  const label = { active:'Paying', trialing:'Trial', past_due:'Payment failing', canceled:'Cancelled', none:'Not subscribed' };
  return '<span class="ctag ' + (map[s.status] || 'info') + '">' + (label[s.status] || s.status) + '</span>' +
    (s.cancel_at_period_end ? '<small class="cap">ending at period end</small>' : '');
}

function wireMemberActions(el){
  const say = (text, kind) => {
    document.getElementById('actionout').innerHTML =
      '<div class="' + (kind || 'okbox') + '" style="margin-top:16px">' + text + '</div>';
  };

  el.querySelectorAll('[data-comp]').forEach(b => b.addEventListener('click', async () => {
    const granting = b.textContent.indexOf('Grant') === 0;
    if(!confirm((granting ? 'Give ' : 'Remove ') + b.dataset.em +
      (granting ? ' free access with no payment?' : "'s free access?"))) return;
    const out = await adminAction({ action: granting ? 'comp' : 'uncomp', userId: b.dataset.comp });
    say(out.message || out.error, out.ok ? 'okbox' : 'alert');
    if(out.ok) render();
  }));

  el.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', async () => {
    const out = await adminAction({ action:'reset', email: b.dataset.reset, userId: b.dataset.uid });
    say(out.message || out.error, out.ok ? 'okbox' : 'alert');
  }));

  el.querySelectorAll('[data-export]').forEach(b => b.addEventListener('click', async () => {
    const out = await adminAction({ action:'export', userId: b.dataset.export });
    if(out.error) return say(out.error, 'alert');
    const blob = new Blob([JSON.stringify(out, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'member-' + b.dataset.export + '.json';
    a.click();
    say('Exported. That file is everything held about them, send it as-is for a subject access request.');
  }));

  el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Delete the account for ' + b.dataset.em + '?\n\nThis removes their profile, standards, events and history. ' +
      'It cannot be undone, and it does NOT cancel their Stripe subscription, do that first.')) return;
    const out = await adminAction({ action:'delete', userId: b.dataset.del });
    say(out.message || out.error, out.ok ? 'okbox' : 'alert');
    if(out.ok) render();
  }));
}

function whatGoesHere(){
  return '' +

    '<div class="grouphead"><h2>What goes here once accounts are live</h2><div class="rule"></div></div>' +
    '<div class="readgrid" style="margin-top:0">' +
      card('Member list', 'Email, organisation, standards followed, signed up, last seen, subscription status. Read from Supabase.') +
      card('Password resets', 'You will not build this. Supabase Auth sends the reset email itself, this page just links to the user.') +
      card('Suspend or cancel', 'Set subscription status, or ban the account in Supabase Auth. Cancellations and refunds happen in Stripe.') +
      card('Export a member&rsquo;s data', 'A saved query returning everything held about one person. This is a legal requirement, not a convenience.') +
      card('Delete a member', 'One statement, cascading across every table. Test it before you need it.') +
      card('Failed payments', 'Stripe handles the chasing emails. You need visibility of who is lapsing, not a billing screen.') +
    '</div>' +

    '<div class="notice" style="margin-top:20px"><b>One thing to decide before that build starts.</b> ' +
    'The moment you hold a real email address you are a data controller under UK GDPR: privacy policy, stated lawful basis, ' +
    'a route for access and deletion requests, and ICO registration. Worth settling the wording before the first sign-up, ' +
    'not after.</div>';
}

function card(t, d){
  return '<div class="readcard"><b style="font-family:var(--display);font-size:15px;display:block;margin-bottom:5px">' + t + '</b><p>' + d + '</p></div>';
}

/* ---------- Write an article ---------- */

const ICON_KEYS = ['stop','coin','cap','book','clock','shop','blocks','check','handshake','desk','flame','layers','signpost'];

function writeView(){
  const routeOpts = '<option value="">Applies to every route</option>' +
    Object.keys(ROUTES).map(k => '<option value="' + k + '">' + ROUTES[k].label + '</option>').join('');

  return '<div class="pagehead"><h1>Write an article</h1>' +
    '<p>Fill this in and it writes the entry for <code>data.js</code>. Once committed, the build generates its own page ' +
    'at <code>/a/&lt;id&gt;.html</code> and adds it to the sitemap.</p></div>' +

    '<div class="writegrid">' +
      '<div class="form" style="margin:0;max-width:none">' +

        '<div class="field"><label for="w-title">Headline</label>' +
        '<p class="hint">Under about 65 characters so it is not cut off in search results.</p>' +
        '<input type="text" id="w-title" placeholder="Sixteen standards lose funding from September 2026"></div>' +

        '<div class="field"><label for="w-summary">One-sentence summary</label>' +
        '<p class="hint">Used on the index, in search results and when the link is shared. Aim for 120 to 155 characters.</p>' +
        '<textarea id="w-summary" rows="2" placeholder="Existing learners are safe, new starts are not."></textarea>' +
        '<div class="counter" id="c-summary">0 characters</div></div>' +

        '<div class="field"><label for="w-stand">Standfirst</label>' +
        '<p class="hint">The line under the headline. One sentence that says why it matters.</p>' +
        '<textarea id="w-stand" rows="2"></textarea></div>' +

        '<div class="field"><label for="w-body">The article</label>' +
        '<p class="hint">One paragraph per line, blank line between them. Aim for 200 to 300 words. ' +
        'A structure that works: what changed, what it changed from, what follows.</p>' +
        '<textarea id="w-body" rows="14"></textarea>' +
        '<div class="counter" id="c-body">0 words</div></div>' +

        '<div class="planfields">' +
          '<div class="field"><label for="w-tag">Category</label>' +
          '<select id="w-tag"><option>Funding rules</option><option>Levy</option><option>T-Levels</option><option>Standard</option></select></div>' +
          '<div class="field"><label for="w-urg">Urgency</label>' +
          '<select id="w-urg"><option value="high">Act now</option><option value="medium" selected>Plan ahead</option><option value="low">For information</option></select></div>' +
          '<div class="field"><label for="w-date">Date</label>' +
          '<input type="date" id="w-date"></div>' +
          '<div class="field"><label for="w-icon">Symbol</label>' +
          '<select id="w-icon">' + ICON_KEYS.map(k => '<option value="' + k + '">' + k + '</option>').join('') + '</select></div>' +
        '</div>' +

        '<div class="field"><label for="w-route">Route</label>' +
        '<select id="w-route">' + routeOpts + '</select></div>' +

        '<div class="field"><label for="w-id">Address</label>' +
        '<p class="hint">Lowercase, hyphens, no spaces. Becomes <code>/a/&lt;this&gt;.html</code> and cannot be changed later without breaking links.</p>' +
        '<input type="text" id="w-id" placeholder="generated from the headline"></div>' +

        '<div class="field"><label>Sources</label>' +
        '<p class="hint">At least one. Every article on the site links to where the facts came from.</p>' +
        '<div id="w-sources"></div>' +
        '<button class="btn small ghost" id="w-addsrc" type="button">Add another source</button></div>' +

        '<button class="btn" id="w-gen">Generate the entry</button>' +
      '</div>' +

      '<div class="writepreview">' +
        '<div class="lhead"><h2>Preview</h2></div>' +
        '<div id="w-preview"><p class="hint">Start typing and it appears here as it will look.</p></div>' +
      '</div>' +
    '</div>' +

    '<div id="w-out"></div>';
}

function sourceRow(i){
  return '<div class="srcrow">' +
    '<input type="text" class="w-slabel" placeholder="GOV.UK, Apprenticeship funding rules" data-i="' + i + '">' +
    '<input type="text" class="w-surl" placeholder="https://www.gov.uk/..." data-i="' + i + '">' +
  '</div>';
}

function wireWrite(panel){
  document.getElementById('w-sources').innerHTML = sourceRow(0) + sourceRow(1);
  document.getElementById('w-date').value = new Date().toISOString().slice(0,10);

  document.getElementById('w-addsrc').addEventListener('click', () => {
    const n = document.querySelectorAll('.srcrow').length;
    document.getElementById('w-sources').insertAdjacentHTML('beforeend', sourceRow(n));
  });

  const slug = s => String(s).toLowerCase()
    .replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-').slice(0, 60);

  const title = document.getElementById('w-title');
  const idBox = document.getElementById('w-id');
  let idTouched = false;
  idBox.addEventListener('input', () => { idTouched = true; });
  title.addEventListener('input', () => {
    if(!idTouched) idBox.value = slug(title.value);
    preview();
  });

  ['w-summary','w-stand','w-body','w-tag','w-urg','w-date','w-route','w-icon']
    .forEach(id => document.getElementById(id).addEventListener('input', preview));

  document.getElementById('w-summary').addEventListener('input', () => {
    const n = document.getElementById('w-summary').value.length;
    const el = document.getElementById('c-summary');
    el.textContent = n + ' characters' + (n > 155 ? ', will be cut off in search results' : n < 60 && n > 0 ? ', could say more' : '');
    el.className = 'counter' + (n > 155 ? ' over' : '');
  });

  document.getElementById('w-body').addEventListener('input', () => {
    const w = document.getElementById('w-body').value.trim().split(/\s+/).filter(Boolean).length;
    const el = document.getElementById('c-body');
    el.textContent = w + ' words' + (w > 340 ? ', long for this site' : w < 200 && w > 0 ? ', thin, most articles run 200 to 300' : '');
    el.className = 'counter' + (w > 340 || (w < 200 && w > 0) ? ' over' : '');
  });

  document.getElementById('w-gen').addEventListener('click', generate);
  preview();
}

function collect(){
  const val = id => (document.getElementById(id).value || '').trim();
  const body = val('w-body').split(/\n\s*\n/).map(p => p.replace(/\s*\n\s*/g, ' ').trim()).filter(Boolean);

  const sources = [];
  document.querySelectorAll('.srcrow').forEach(r => {
    const label = r.querySelector('.w-slabel').value.trim();
    const url = r.querySelector('.w-surl').value.trim();
    if(label && url) sources.push({ label: label, url: url });
  });

  return {
    id: val('w-id'), title: val('w-title'), summary: val('w-summary'),
    standfirst: val('w-stand'), body: body, tag: val('w-tag'),
    urgency: val('w-urg'), date: val('w-date'), route: val('w-route'),
    icon: val('w-icon'), sources: sources
  };
}

function preview(){
  const a = collect();
  const el = document.getElementById('w-preview');
  if(!a.title && !a.body.length){
    el.innerHTML = '<p class="hint">Start typing and it appears here as it will look.</p>';
    return;
  }
  const route = a.route && ROUTES[a.route] ? ROUTES[a.route] : null;
  el.innerHTML =
    '<div class="ptags">' +
      '<span class="tag ' + tagClass(a.tag) + '">' + (a.tag || 'Category') + '</span>' +
      urgencyTag(a.urgency) +
      (route ? '<span class="tag t-standard">' + route.label + '</span>' : '') +
    '</div>' +
    '<h1 style="font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:-0.02em;line-height:1.2;margin:0 0 12px">' +
      (a.title || 'Your headline') + '</h1>' +
    (a.standfirst ? '<p class="pstand" style="font-size:15.5px;margin-bottom:18px">' + a.standfirst + '</p>' : '') +
    '<div class="pbody">' + a.body.map(p => '<p style="font-size:14.5px">' + p + '</p>').join('') + '</div>' +
    (a.id ? '<div class="hint" style="margin-top:14px">Will publish at <code>/a/' + a.id + '.html</code></div>' : '');
}

function generate(){
  const a = collect();
  const problems = [];
  if(!a.id) problems.push('an address');
  if(!a.title) problems.push('a headline');
  if(!a.summary) problems.push('a summary');
  if(!a.standfirst) problems.push('a standfirst');
  if(!a.body.length) problems.push('at least one paragraph');
  if(!a.sources.length) problems.push('at least one source');

  const existing = allArticles().some(x => x.id === a.id);
  if(existing) problems.push('an address that is not already taken (' + a.id + ' exists)');

  const out = document.getElementById('w-out');
  if(problems.length){
    out.innerHTML = '<div class="alert" style="margin-top:22px"><b>Still needed:</b> ' + problems.join(', ') + '.</div>';
    out.scrollIntoView({ behavior:'smooth', block:'nearest' });
    return;
  }

  const q = v => JSON.stringify(String(v));
  const code =
    'ARTICLES.push({\n' +
    '  id: ' + q(a.id) + ',\n' +
    '  icon: ' + q(a.icon) + ', tag: ' + q(a.tag) + ', urgency: ' + q(a.urgency) + ', route: ' + q(a.route) + ',\n' +
    '  date: ' + q(a.date) + ',\n' +
    '  title: ' + q(a.title) + ',\n' +
    '  summary: ' + q(a.summary) + ',\n' +
    '  standfirst: ' + q(a.standfirst) + ',\n' +
    '  body: [\n' + a.body.map(p => '    ' + q(p)).join(',\n') + '\n  ],\n' +
    '  sources: [\n' + a.sources.map(s => '    { label: ' + q(s.label) + ', url: ' + q(s.url) + ' }').join(',\n') + '\n  ]\n' +
    '});';

  out.innerHTML =
    '<div class="lsection costs" style="margin-top:26px">' +
      '<div class="lhead"><h2>Add this to data.js</h2>' +
      '<p>Paste it at the end of the file, below the other <code>ARTICLES.push</code> blocks. ' +
      'Then set <code>DATA_UPDATED</code> to today so the site shows the right review date.</p></div>' +
      '<pre class="codeout">' + code.replace(/</g,'&lt;') + '</pre>' +
      '<div class="addrow" style="margin-top:14px">' +
        '<button class="btn small" id="w-copy">Copy</button>' +
        '<button class="btn small ghost" id="w-dl">Download as a file</button>' +
      '</div>' +
      '<div class="notice" style="margin-top:16px"><b>What happens next.</b> ' +
      'Commit the change and Vercel runs the build, which generates <code>/a/' + a.id + '.html</code> as a real page ' +
      'with its own title, description and structured data, and adds it to <code>sitemap.xml</code>. ' +
      'Nothing else to do.</div>' +
    '</div>';

  document.getElementById('w-copy').addEventListener('click', () => {
    navigator.clipboard.writeText(code);
    document.getElementById('w-copy').textContent = 'Copied';
    setTimeout(() => { document.getElementById('w-copy').textContent = 'Copy'; }, 1600);
  });

  document.getElementById('w-dl').addEventListener('click', () => {
    const blob = new Blob([code + '\n'], { type: 'text/javascript' });
    const el = document.createElement('a');
    el.href = URL.createObjectURL(blob);
    el.download = 'article-' + a.id + '.js';
    el.click();
    URL.revokeObjectURL(el.href);
  });

  out.scrollIntoView({ behavior:'smooth', block:'start' });
}

    'and cannot be edited directly.</p></div>' +

    '<div class="mgrid">' +
      '<div class="mcard"><div class="n">' + arts.length + '</div><div class="l">Total articles</div></div>' +
      '<div class="mcard cool"><div class="n">' + written.length + '</div><div class="l">Written by hand</div></div>' +
      '<div class="mcard warm"><div class="n">' + compiled.length + '</div><div class="l">Compiled</div></div>' +
      '<div class="mcard"><div class="n">' + allUpdates().filter(u => !u.article).length + '</div><div class="l">Feed items with no article</div></div>' +
    '</div>' +

    '<div class="grouphead"><h2>Written articles</h2><div class="rule"></div></div>' +
    '<table class="std"><thead><tr><th>Article</th><th>Category</th><th>Date</th><th>Address</th><th></th></tr></thead><tbody>' +
    written.map(a => '<tr><td class="nm">' + a.title + '<small>' + a.summary + '</small></td>' +
      '<td>' + a.tag + '</td><td class="num">' + fmtLong(a.date) + '</td>' +
      '<td><a class="stdlink" href="a/' + a.id + '.html">/a/' + a.id + '</a></td>' +

/* ---------- Removing an article ----------

   The site's content lives in data.js in the repo, so nothing here can
   delete a file directly, and that is the right shape, because every change
   should be a commit you can revert. This works out exactly what to remove
   and what else points at it, so a deletion does not leave dead links behind.
*/

function wireRemove(panel){
  panel.querySelectorAll('[data-remove]').forEach(b =>
    b.addEventListener('click', () => removeArticle(b.dataset.remove)));
}

function removeArticle(id){
  const article = allArticles().find(a => a.id === id);
  if(!article) return;

  // what would break
  const feedRefs = allUpdates().filter(u => u.article === id);
  const stdRefs  = STANDARDS.filter(s => s.article === id);
  const msRefs   = MILESTONES.filter(m => m.article === id);
  const incRefs  = (typeof INCENTIVES !== 'undefined' ? INCENTIVES : []).filter(i => i.article === id);
  const total    = stdRefs.length + msRefs.length + incRefs.length;

  document.getElementById('removeout').innerHTML =
    '<div class="lsection costs" style="margin-top:24px">' +
      '<div class="lhead"><h2>Remove &ldquo;' + article.title + '&rdquo;</h2>' +
      '<p>Nothing has changed yet. This is what removing it involves.</p></div>' +

      (total || feedRefs.length
        ? '<div class="alert"><b>' + (total || feedRefs.length) + ' thing' + ((total || feedRefs.length) === 1 ? '' : 's') +
          ' link to this article.</b> Remove the <code>article:</code> line from each, or they will point at a page ' +
          'that no longer exists.' +
          '<ul style="margin:10px 0 0;padding-left:18px;font-size:13px">' +
            stdRefs.map(s => '<li>Standard: <b>' + s.name + '</b>, remove <code>article:"' + id + '"</code></li>').join('') +
            msRefs.map(m => '<li>Milestone: <b>' + m.title + '</b></li>').join('') +
            incRefs.map(i => '<li>Incentive: <b>' + i.name + '</b></li>').join('') +
            (!total && feedRefs.length ? '<li>' + feedRefs.length + ' feed item' + (feedRefs.length === 1 ? '' : 's') +
              ' resolve to it automatically, those will fall back to their route round-up, so nothing breaks.</li>' : '') +
          '</ul></div>'
        : '<div class="okbox"><b>Nothing links to it.</b> Safe to remove.</div>') +

      '<div class="grouphead" style="margin-top:22px"><h2>How to remove it</h2><div class="rule"></div></div>' +
      '<ol class="replist" style="margin-top:14px">' +
        '<li><b>Open data.js on GitHub</b><span>Search for <code>id: "' + id + '"</code>.</span></li>' +
        '<li><b>Delete that whole block</b><span>From the opening brace of the entry to the closing one, including the trailing comma.</span></li>' +
        (total ? '<li><b>Remove the links listed above</b><span>Delete the <code>article:</code> property from each one.</span></li>' : '') +
        '<li><b>Update the stamp</b><span>Set <code>DATA_UPDATED</code> to today.</span></li>' +
        '<li><b>Commit</b><span>The build regenerates the site without it, and drops it from the sitemap. ' +
        'The old page stops existing, so any link already shared will 404, that is the cost of deleting rather than rewriting.</span></li>' +
      '</ol>' +

      '<div class="notice" style="margin-top:18px"><b>Consider rewriting instead.</b> ' +
      'If the article is wrong rather than unwanted, editing it keeps the address alive for anyone who has already ' +
      'bookmarked or shared it. Deleting is the right call for a duplicate or something published by mistake.</div>' +

      '<button class="btn small ghost" id="cancelremove" style="margin-top:16px">Close</button>' +
    '</div>';

  document.getElementById('cancelremove').addEventListener('click', () => {
    document.getElementById('removeout').innerHTML = '';
  });
  document.getElementById('removeout').scrollIntoView({ behavior:'smooth', block:'nearest' });
}

/* =========================================================================
   BRAND

   Everything needed to put the mark on something that is not this site: a
   deck, an invoice, a LinkedIn banner, a letterhead.

   The logos are drawn as SVG rather than stored as image files, which means
   they are sharp at any size, weigh almost nothing, and cannot drift out of
   step with the site. Each downloads as a real .svg; the colour values
   copy to the clipboard.
   ========================================================================= */

const BRAND = {
  ink:   '#0D1B1E',
  teal:  '#6ED0B6',
  deep:  '#10796A',
  paper: '#FAF9F6',
  line:  '#E4E0D6',
  text:  '#152023',
  high:  '#B3261E',
  med:   '#A96A06'
};

/* One function draws every variant, so the files cannot drift apart.

   The mark is the words, joined by the hyphen from the domain. That hyphen
   is doing three jobs at once: it ties the logo to skills-radar.co.uk, it
   carries the accent colour, and it fills the gap between the two words
   rather than leaving a hole in the middle of the mark. A tight logo holds
   together at small sizes; a loose one falls into two separate words.

   Set as one text element with tspans rather than two positioned separately,
   so the spacing comes from the typeface itself and cannot drift when the
   font loads or the size changes.
*/
function logoSVG(shape, mode, forDownload){
  const dark = mode === 'dark';
  const bg   = dark ? BRAND.ink : BRAND.paper;
  const word = dark ? '#FFFFFF' : BRAND.text;
  const mark = dark ? BRAND.teal : BRAND.deep;
  const font = 'Newsreader, Georgia, \'Times New Roman\', serif';

  function open(w, h){
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" ' +
      'width="' + w + '" height="' + h + '" role="img" aria-label="Skills Radar">' +
      '<rect width="' + w + '" height="' + h + '" fill="' + bg + '"/>';
  }

  if(shape === 'square'){
    /* Stacked and tight, with the hyphen set between the two lines where it
       reads as both a link and a rule. Nearly fills the frame, because every
       platform crops a square and padding is the first thing lost. */
    return open(400, 400) +
      '<text x="200" y="176" text-anchor="middle" font-family="' + font + '" ' +
        'font-size="112" font-weight="700" letter-spacing="-6" fill="' + word + '">Skills</text>' +
      '<rect x="178" y="202" width="44" height="11" fill="' + mark + '"/>' +
      '<text x="200" y="320" text-anchor="middle" font-family="' + font + '" ' +
        'font-size="112" font-weight="500" letter-spacing="-6" fill="' + mark + '">Radar</text>' +
    '</svg>';
  }

  /* One line, one text element, hyphen in the accent colour. */
  return open(680, 170) +
    '<text x="340" y="116" text-anchor="middle" font-family="' + font + '" ' +
      'font-size="92" font-weight="700" letter-spacing="-5" fill="' + word + '">' +
      'Skills<tspan fill="' + mark + '">-</tspan>' +
      '<tspan font-weight="500" fill="' + mark + '">Radar</tspan>' +
    '</text>' +
  '</svg>';
}

function brandView(){
  const swatch = (name, hex, note) =>
    '<button class="swatch" data-hex="' + hex + '">' +
      '<span class="sw" style="background:' + hex + '"></span>' +
      '<span class="swname">' + name + '</span>' +
      '<span class="swhex">' + hex + '</span>' +
      '<span class="swnote">' + note + '</span>' +
    '</button>';

  const logoCard = (shape, mode) =>
    '<div class="logocard ' + mode + '">' +
      '<div class="logoart">' + logoSVG(shape, mode, false) + '</div>' +
      '<div class="logofoot">' +
        '<b>' + (shape === 'square' ? 'Square' : 'Horizontal') + ', ' +
          (mode === 'dark' ? 'dark ground' : 'light ground') + '</b>' +
        '<button class="todoact" data-logo="' + shape + '-' + mode + '">Download SVG</button>' +
      '</div>' +
    '</div>';

  return '<div class="pagehead"><h1>Brand</h1>' +
    '<p>The mark, the colours and the type, in a form you can put on something that is not this site. ' +
    'Everything here is drawn rather than stored, so it is sharp at any size and always matches the live site.</p></div>' +

    '<div class="grouphead" style="margin-top:0"><h2>The mark</h2><div class="rule"></div>' +
      '<span class="hint" style="margin:0">SVG, so it scales to a billboard without blurring</span></div>' +

    '<div class="logogrid">' +
      logoCard('horizontal', 'dark') +
      logoCard('horizontal', 'light') +
      logoCard('square', 'dark') +
      logoCard('square', 'light') +
    '</div>' +

    '<div class="notice"><b>Which to use.</b> ' +
    'Horizontal for anything with a header: a letterhead, a slide, an email signature, a LinkedIn banner. ' +
    'Square for anything that crops to a circle or a tile: a profile picture on LinkedIn or X, an app icon, ' +
    'a favicon. The square is set tight on purpose, because every platform crops it and padding is the first ' +
    'thing lost. Dark ground is the default and the one that looks like the site.</div>' +

    '<div class="notice"><b>Why the hyphen.</b> ' +
    'It is the one from skills-radar.co.uk, so the mark and the address teach each other. It also solves a ' +
    'real problem: two words side by side leave a gap in the middle, and at small sizes a logo with a hole in ' +
    'it stops reading as one thing. The hyphen fills that gap and carries the accent colour at the same time.' +
    '</div>' +

    '<div class="notice"><b>No symbol, and no italic.</b> ' +
    'The mark is the words. A symbol has to earn its place by being recognised, which takes years and a budget, ' +
    'and until then it is something else competing with the name. The italic went the same way: it read as ' +
    'decorative rather than deliberate, and vanished once a platform scaled it to a 32-pixel avatar. ' +
    'Weight carries the difference instead, and weight survives being shrunk.</div>' +

    '<div class="grouphead"><h2>Colours</h2><div class="rule"></div>' +
      '<span class="hint" style="margin:0">Click to copy</span></div>' +

    '<div class="swatches">' +
      swatch('Ink', BRAND.ink, 'Backgrounds, headings, the masthead') +
      swatch('Teal', BRAND.teal, 'The accent. On dark only') +
      swatch('Deep green', BRAND.deep, 'The accent on light grounds, and buttons') +
      swatch('Paper', BRAND.paper, 'Page background') +
      swatch('Line', BRAND.line, 'Rules and borders') +
      swatch('Text', BRAND.text, 'Body copy on light') +
      swatch('Red', BRAND.high, 'Act now. Sparingly') +
      swatch('Amber', BRAND.med, 'Plan ahead') +
    '</div>' +

    '<div class="notice"><b>One rule about the teal.</b> ' +
    'It does not have enough contrast on a light background to be readable. On white or paper, use the deep ' +
    'green instead. Teal is for dark grounds only, which is why the site uses it almost entirely inside the ' +
    'masthead.</div>' +

    '<div class="grouphead"><h2>Type</h2><div class="rule"></div></div>' +

    '<div class="typegrid">' +
      '<div class="typecard">' +
        '<p class="tspec">Newsreader &middot; headlines, articles, anything editorial</p>' +
        '<p class="tsample serif">Sixteen standards lose funding</p>' +
        '<p class="tsample serif small">Regular, medium, semibold. Use the italic for standfirsts and ' +
        'publication titles, and nothing else.</p>' +
        '<a class="todoact" href="https://fonts.google.com/specimen/Newsreader" target="_blank" rel="noopener">Get it free &nearr;</a>' +
      '</div>' +
      '<div class="typecard">' +
        '<p class="tspec">Public Sans &middot; interface, tables, labels, buttons</p>' +
        '<p class="tsample sans">348 hours off-the-job</p>' +
        '<p class="tsample sans small">Regular, medium, semibold, bold. Labels and kickers go uppercase ' +
        'at 10 to 11px with wide letter spacing.</p>' +
        '<a class="todoact" href="https://fonts.google.com/specimen/Public+Sans" target="_blank" rel="noopener">Get it free &nearr;</a>' +
      '</div>' +
    '</div>' +

    '<div class="notice"><b>If you cannot load them.</b> ' +
    'In Word, PowerPoint or anywhere else without web fonts: Georgia in place of Newsreader, Arial or ' +
    'Calibri in place of Public Sans. Both are close enough in proportion that a document still looks related ' +
    'to the site.</div>' +

    '<div class="grouphead"><h2>Writing</h2><div class="rule"></div></div>' +
    '<div class="todolist">' +
      '<div class="todo watch"><div class="todotext"><h3>No em dashes</h3>' +
      '<p>A comma, a colon or a full stop instead. They are the clearest tell of machine-written copy and ' +
      'the site removes them on import.</p></div></div>' +
      '<div class="todo watch"><div class="todotext"><h3>Italics mean something</h3>' +
      '<p>A publication title, a standfirst, or real emphasis inside a sentence. Not for decoration and not ' +
      'for whole paragraphs.</p></div></div>' +
      '<div class="todo watch"><div class="todotext"><h3>British spelling, and the date written out</h3>' +
      '<p>Organisation, not organization. 1 September 2026, not 01/09/2026, which is read differently on ' +
      'either side of the Atlantic.</p></div></div>' +
      '<div class="todo watch"><div class="todotext"><h3>Say the number</h3>' +
      '<p>&ldquo;Sixteen standards lose funding&rdquo; beats &ldquo;several standards are affected&rdquo;. ' +
      'The specific figure is the whole reason anyone believes the rest of it.</p></div></div>' +
    '</div>' +

    '<div id="brandout"></div>';
}

function wireBrand(panel){
  /* Downloads build the file at full size with the download flag set, so
     the saved SVG carries its own font declaration rather than relying on
     whatever the opening application happens to have. */
  panel.querySelectorAll('[data-logo]').forEach(b => b.addEventListener('click', () => {
    const [shape, mode] = b.dataset.logo.split('-');
    const svg = logoSVG(shape, mode, true);
    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'skills-radar-' + shape + '-' + mode + '.svg';
    a.click();
    URL.revokeObjectURL(a.href);
    say('Downloaded skills-radar-' + shape + '-' + mode + '.svg. ' +
      'Opens in anything, including Word and PowerPoint, and stays sharp at any size.');
  }));

  panel.querySelectorAll('.swatch').forEach(b => b.addEventListener('click', () => {
    navigator.clipboard.writeText(b.dataset.hex);
    const was = b.querySelector('.swhex').textContent;
    b.querySelector('.swhex').textContent = 'copied';
    setTimeout(() => { b.querySelector('.swhex').textContent = was; }, 1300);
  }));

  function say(text){
    const out = document.getElementById('brandout');
    if(out) out.innerHTML = '<div class="okbox" style="margin-top:18px">' + text + '</div>';
  }
}

/* ---------- Email lists ----------

   The site does not send. It exports, and you paste the list into whatever
   you use to write the newsletter. That is deliberate: a static site has no
   server to send from, and a mailing service will do it better anyway.

   Two lists, and the distinction is legal rather than cosmetic. The
   newsletter list excludes anyone who ticked the box at sign-up. The full
   list is everyone, and may only be used for things about their account  to 
   a payment failing, a change to the terms. Sending marketing to the full
   list would breach PECR.
*/

function emailView(){
  if(!accountsLive()){
    return '<div class="pagehead"><h1>Email lists</h1><p>Not connected yet.</p></div>' +
      '<div class="notice" style="margin-top:0"><b>Nothing to export.</b> ' +
      '<code>config.js</code> still has placeholder values, so there are no members to list.</div>';
  }

  return '<div class="pagehead"><h1>Email lists</h1>' +
    '<p>Who to write to, and what to write to them about. Grouped by the standards people deliver, ' +
    'because that is the thing they signed up to hear about.</p></div>' +
    '<div id="maillists"><p class="hint">Loading…</p></div>';
}

async function loadEmails(){
  const el = document.getElementById('maillists');
  if(!el || !accountsLive()) return;

  const out = await adminFetch('members');
  if(!out || out.failed || !out.members){ el.innerHTML = failureHTML(out, 'the member list'); return; }

  const aud = await adminFetch('audience');
  const groups = (aud && aud.groups) ? aud.groups : [];

  const all = out.members;
  const optedIn = all.filter(m => !m.email_opt_out);
  const optedOut = all.filter(m => m.email_opt_out);
  const noCohort = all.filter(m => !m.cohort || !m.cohort.length);

  el.innerHTML =
    '<div class="mgrid">' +
      '<div class="mcard cool"><div class="n">' + optedIn.length + '</div><div class="l">Opted in</div></div>' +
      '<div class="mcard"><div class="n">' + groups.length + '</div><div class="l">Standards covered</div></div>' +
      '<div class="mcard warm"><div class="n">' + noCohort.length + '</div><div class="l">No cohort set</div></div>' +
      '<div class="mcard"><div class="n">' + all.length + '</div><div class="l">All accounts</div></div>' +
    '</div>' +

    (noCohort.length
      ? '<div class="notice"><b>' + noCohort.length + ' member' + (noCohort.length === 1 ? ' has' : 's have') +
        ' not chosen any standards yet.</b> They cannot receive a personalised digest, because there is nothing ' +
        'to personalise it from. Worth a one-off email asking them to set their cohort, which is the single ' +
        'thing that makes the rest of the product work for them.</div>'
      : '') +

    '<div class="grouphead"><h2>Who to write to about what</h2><div class="rule"></div>' +
      '<span class="hint" style="margin:0">Members grouped by the standards they deliver</span></div>' +

    (groups.length
      ? '<div class="audlist">' +
          groups.map((g, i) =>
            '<details class="audgroup">' +
              '<summary>' +
                '<span class="audname">L' + g.level + ' ' + g.standard + '</span>' +
                '<span class="audcount">' + g.members.length + ' member' + (g.members.length === 1 ? '' : 's') +
                  ' &middot; ' + g.apprentices + ' apprentice' + (g.apprentices === 1 ? '' : 's') + '</span>' +
              '</summary>' +
              '<div class="audbody">' +
                '<div class="addrow" style="margin:0 0 12px">' +
                  '<button class="btn small" data-grp="' + i + '" data-act="copy">Copy ' + g.optedIn + ' addresses</button>' +
                  '<button class="btn small ghost" data-grp="' + i + '" data-act="csv">CSV</button>' +
                  '<span class="hint" style="align-self:center;margin:0">Opted-in members only</span>' +
                '</div>' +
                '<table class="std"><thead><tr><th>Email</th><th>Organisation</th><th class="num">Apprentices</th><th>Newsletter</th></tr></thead><tbody>' +
                  g.members.map(m => '<tr><td class="nm">' + m.email + '</td>' +
                    '<td>' + (m.org || '&mdash;') + '</td>' +
                    '<td class="num">' + m.count + '</td>' +
                    '<td>' + (m.optedIn ? '<span class="ctag new">in</span>' : '<span class="ctag stop">out</span>') + '</td></tr>').join('') +
                '</tbody></table>' +
              '</div>' +
            '</details>').join('') +
        '</div>'
      : '<p class="hint">No members have chosen standards yet.</p>') +

    '<div class="grouphead"><h2>Whole-list exports</h2><div class="rule"></div></div>' +
    '<div class="todolist">' +
      '<div class="todo watch"><div class="todotext"><h3>Opted in, with their standards</h3>' +
      '<p>' + optedIn.length + ' addresses, each row listing the standards that member delivers and how many ' +
      'apprentices are on each. This is the file to work from when writing anything targeted.</p></div>' +
      '<div class="mailbtns"><button class="todoact" data-dl="news-csv">CSV</button>' +
      '<button class="todoact" data-dl="news-copy">Copy addresses</button></div></div>' +

      '<div class="todo stop"><div class="todotext"><h3>All accounts</h3>' +
      '<p>Everyone, including the ' + optedOut.length + ' who opted out. Account messages only: a payment ' +
      'failing, a change to the terms. Marketing to this list would breach PECR.</p></div>' +
      '<div class="mailbtns"><button class="todoact" data-dl="all-csv">CSV</button></div></div>' +
    '</div>' +

    '<div id="mailout"></div>' +

    '<div class="notice" style="margin-top:20px"><b>What every newsletter has to carry.</b> ' +
    'A working unsubscribe link, your organisation&rsquo;s name, and a postal address. That is PECR, not etiquette. ' +
    'When somebody unsubscribes at the mailing service, tick their opt-out here too, or the next export puts ' +
    'them straight back on the list.</div>';

  wireEmail(el, optedIn, all, groups);
}

function wireEmail(el, optedIn, all){
  const csv = rows => {
    const head = 'email,organisation,newsletter,status,joined';
    const body = rows.map(m => [
      m.email,
      '"' + String(m.org_name || '').replace(/"/g, '""') + '"',
      m.email_opt_out ? 'opted-out' : (m.frequency || 'monthly'),
      m.subscription.status,
      m.created_at.slice(0, 10)
    ].join(','));
    return [head].concat(body).join('\n');
  };

  const download = (text, name, type) => {
    const blob = new Blob([text], { type: type || 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const stamp = new Date().toISOString().slice(0, 10);

  /* Per-standard actions: the list for one change, rather than everyone. */
  el.querySelectorAll('[data-grp]').forEach(b => b.addEventListener('click', () => {
    const g = groups[+b.dataset.grp];
    if(!g) return;
    const inOnly = g.members.filter(m => m.optedIn);

    if(b.dataset.act === 'copy'){
      navigator.clipboard.writeText(inOnly.map(m => m.email).join(', '));
      b.textContent = 'Copied';
      setTimeout(() => { b.textContent = 'Copy ' + inOnly.length + ' addresses'; }, 1600);
      note(inOnly.length + ' addresses for L' + g.level + ' ' + g.standard +
        ', comma separated. Paste into BCC, never To or Cc.');
    }
    if(b.dataset.act === 'csv'){
      download(groupCsv({ members: inOnly }),
        'skills-radar-' + g.standard.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + stamp + '.csv');
      note(inOnly.length + ' members who deliver L' + g.level + ' ' + g.standard + ' downloaded.');
    }
  }));

  el.querySelectorAll('[data-dl]').forEach(b => b.addEventListener('click', () => {
    const what = b.dataset.dl;

    if(what === 'news-csv'){
      download(csv(optedIn), 'skills-radar-newsletter-' + stamp + '.csv');
      note(optedIn.length + ' addresses downloaded. Opted-out members are not in this file.');
    }
    if(what === 'all-csv'){
      download(csv(all), 'skills-radar-all-accounts-' + stamp + '.csv');
      note('All ' + all.length + ' accounts downloaded, including opt-outs. Account messages only.');
    }
    if(what === 'news-copy'){
      const list = optedIn.map(m => m.email).join(', ');
      navigator.clipboard.writeText(list);
      b.textContent = 'Copied';
      setTimeout(() => { b.textContent = 'Copy addresses'; }, 1600);
      note(optedIn.length + ' addresses copied, comma separated. Paste into the BCC field, never To or Cc, ' +
        'or every member sees every other member&rsquo;s address.');
    }
  }));

  function note(text){
    document.getElementById('mailout').innerHTML =
      '<div class="okbox" style="margin-top:16px">' + text + '</div>';
  }
}

document.getElementById('foot').textContent =
  'Administration. This page is excluded from search engines and from the sitemap.';

</script>
