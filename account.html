<footer>

<script>

document.getElementById('heroblock').innerHTML = titleBlockHTML('');
document.getElementById('navslot').innerHTML = navHTML('members.html');

const panel = document.getElementById('panel');
const q = new URLSearchParams(location.search);

/* =========================================================================
   ROUTING

   One page handling join, sign in, forgotten password and setting a new
   one, because they are the same journey and splitting them across four
   files makes the flow harder to follow than it needs to be.
   ========================================================================= */

async function boot(){
  if(typeof window.supabase === 'undefined'){
    throw new Error('The Supabase library did not load. Check the script tag at the foot of the page, and that nothing is blocking cdn.jsdelivr.net.');
  }
  if(!accountsLive()){
    panel.innerHTML = notConnected();
    return;
  }

  // Supabase sends people back here after a reset email
  if(q.get('reset') === '1' || location.hash.indexOf('type=recovery') > -1){
    return show('newpassword');
  }
  if(q.get('verified') === '1'){
    return show('signin', 'Email confirmed. Sign in to carry on.');
  }

  const user = await currentUser();
  if(user){
    const sub = await getSubscription();
    const profile = await getProfile();
    if(hasAccess(sub, profile)) location.replace('members.html');
    else show('pay');
    return;
  }

  show(q.get('join') === '1' ? 'join' : 'signin');
}

function show(view, message){
  if(view === 'join')        panel.innerHTML = joinView(message);
  if(view === 'signin')      panel.innerHTML = signinView(message);
  if(view === 'forgot')      panel.innerHTML = forgotView(message);
  if(view === 'newpassword') panel.innerHTML = newPasswordView(message);
  if(view === 'pay')         { payView(message); return; }
  wire(view);
}

function msg(text, kind){
  return text ? '<div class="' + (kind || 'okbox') + '" style="margin-bottom:18px">' + text + '</div>' : '';
}

/* ---------- Join ---------- */

function joinView(message){
  const price = MEMBERSHIP.price, period = MEMBERSHIP.period;

  return '<div class="pagehead centred"><h1>Create your account</h1>' +
    '<p>' + price + ' ' + period + '. Cancel any time from your own account page.</p></div>' +

    '<div class="joincol">' +

      '<div class="signin-panel joinpanel">' +
        msg(message) +

        '<form id="form" novalidate autocomplete="on">' +

          '<div class="field">' +
            '<label for="email">Email</label>' +
            '<input type="email" id="email" name="email" autocomplete="email" ' +
              'inputmode="email" autocapitalize="off" spellcheck="false" ' +
              'placeholder="you@organisation.co.uk" required>' +
          '</div>' +

          '<div class="field">' +
            '<label for="org">Organisation <i>(optional)</i></label>' +
            '<input type="text" id="org" name="organization" autocomplete="organization" ' +
              'placeholder="Your college, provider or employer">' +
          '</div>' +

          '<div class="field">' +
            '<label for="password">Password</label>' +
            '<div class="pwwrap">' +
              '<input type="password" id="password" name="password" ' +
                'autocomplete="new-password" minlength="8" required>' +
              '<button type="button" class="peek" id="peek" aria-label="Show password">Show</button>' +
            '</div>' +
            '<p class="fieldnote" id="pwnote">At least eight characters.</p>' +
          '</div>' +

          '<label class="optrow" for="optout">' +
            '<input type="checkbox" id="optout" name="optout">' +
            '<span class="optmark" aria-hidden="true"></span>' +
            '<span class="opttext"><b>Do not send me the monthly newsletter</b>' +
            'You will still get emails about your account and your payment.</span>' +
          '</label>' +

          '<div class="err" id="err" hidden></div>' +
          '<button class="btn wide" type="submit" id="go">Create account &middot; ' + price + ' ' + period + '</button>' +
          '<p class="formfoot">Next you confirm your email, then pay. ' +
          'Card details are handled by Stripe and never reach this site.</p>' +
        '</form>' +

        '<div class="demo"><span>Already a member?</span>' +
          '<button type="button" class="fill" id="toSignin">Sign in</button></div>' +
      '</div>' +

      '<section class="whatyouget">' +
        '<h2>What you get</h2>' +
        benefit('A feed that is only yours',
          'There are 378 standards on the register and 180 live changes. Choose the ones you deliver and the ' +
          'feed shows changes to those, alongside the funding rules that apply to everyone — with what changed, ' +
          'what it changed from, and what follows.') +
        benefit('The monthly newsletter',
          'What moved and what it means, once a month. Written rather than generated, and focused on what you ' +
          'have to do about it. Turn it off in one click without losing your account.') +
        benefit('Levy forecasting',
          'Month by month on your own pay bill and your own cohorts. It names the month co-investment starts, ' +
          'shows how much expires unused, and lets you drop in apprentices you are only considering to see what ' +
          'they would cost before committing.') +
        benefit('Compliance, in one place',
          'Off-the-job hours against the published minimum for each of 713 standards. A calendar of the deadlines ' +
          'that touch your provision. And a board report you can print, with your funding position and risks ' +
          'already written up.') +
        '<p class="getfoot">Your data is yours. Export or delete all of it at any time, from your own account page.</p>' +
      '</section>' +
    '</div>';
}

function benefit(t, d){
  return '<details class="benefit">' +
    '<summary><span>' + t + '</span></summary>' +
    '<p>' + d + '</p>' +
  '</details>';
}

function field(id, label, type, ph){
  return '<div class="field"><label for="' + id + '">' + label + '</label>' +
    '<input type="' + type + '" id="' + id + '" placeholder="' + ph + '" autocomplete="' +
    (type === 'email' ? 'email' : 'organization') + '"></div>';
}

/* ---------- Sign in ---------- */

function signinView(message){
  return '<div class="pagehead centred"><h1>Sign in</h1>' +
    '<p>Your calendar, your feed, your levy position.</p></div>' +
    '<div class="signin" style="max-width:480px;margin:0 auto 60px;grid-template-columns:1fr">' +
      '<div class="signin-panel">' +
        msg(message) +
        '<form id="form" novalidate>' +
          field('email', 'Email', 'email', 'you@organisation.co.uk') +
          '<div class="field"><label for="password">Password</label>' +
            '<div class="pwwrap"><input type="password" id="password" autocomplete="current-password">' +
            '<button type="button" class="peek" id="peek">Show</button></div></div>' +
          '<div class="err" id="err" hidden></div>' +
          '<button class="btn" type="submit" id="go">Sign in</button>' +
        '</form>' +
        '<div class="demo" style="margin-top:20px">' +
          '<button type="button" class="fill" id="toForgot">Forgotten your password?</button>' +
          '<button type="button" class="fill" id="toJoin" style="margin-left:auto">Create an account</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

/* ---------- Forgotten password ---------- */

function forgotView(message){
  return '<div class="pagehead centred"><h1>Reset your password</h1>' +
    '<p>We will email you a link. It expires in an hour.</p></div>' +
    '<div class="signin" style="max-width:480px;margin:0 auto 60px;grid-template-columns:1fr">' +
      '<div class="signin-panel">' +
        msg(message) +
        '<form id="form" novalidate>' +
          field('email', 'Email', 'email', 'you@organisation.co.uk') +
          '<div class="err" id="err" hidden></div>' +
          '<button class="btn" type="submit" id="go">Send the link</button>' +
        '</form>' +
        '<div class="demo" style="margin-top:20px">' +
          '<button type="button" class="fill" id="toSignin">Back to sign in</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

/* ---------- New password ---------- */

function newPasswordView(message){
  return '<div class="pagehead centred"><h1>Choose a new password</h1>' +
    '<p>At least eight characters.</p></div>' +
    '<div class="signin" style="max-width:480px;margin:0 auto 60px;grid-template-columns:1fr">' +
      '<div class="signin-panel">' +
        msg(message) +
        '<form id="form" novalidate>' +
          '<div class="field"><label for="password">New password</label>' +
            '<div class="pwwrap"><input type="password" id="password" autocomplete="new-password">' +
            '<button type="button" class="peek" id="peek">Show</button></div></div>' +
          '<div class="err" id="err" hidden></div>' +
          '<button class="btn" type="submit" id="go">Save it</button>' +
        '</form>' +
      '</div>' +
    '</div>';
}

/* ---------- Payment ---------- */

async function payView(message){
  const profile = await getProfile();
  const sub = await getSubscription();
  const cancelled = q.get('cancelled') === '1';

  panel.innerHTML = '<div class="pagehead centred"><h1>One more step</h1>' +
    '<p>Your account exists. Membership is ' + MEMBERSHIP.price + ' ' + MEMBERSHIP.period + '.</p></div>' +

    '<div class="signin" style="max-width:560px;margin:0 auto 60px;grid-template-columns:1fr">' +
      '<div class="signin-panel">' +
        msg(message) +
        (cancelled ? msg('Checkout was cancelled. Nothing has been charged.', 'notice') : '') +
        (sub && sub.status === 'past_due'
          ? msg('Your last payment did not go through. Stripe will try again, and you keep access meanwhile. ' +
                'Updating your card now avoids losing it.', 'notice') : '') +

        '<h2>' + MEMBERSHIP.price + ' ' + MEMBERSHIP.period + '</h2>' +
        '<p>Signed in as ' + (profile ? profile.email : '') + '</p>' +

        '<ul class="paylist">' +
          '<li>A feed showing only what affects your standards</li>' +
          '<li>The monthly newsletter</li>' +
          '<li>Levy forecasting against your own figures</li>' +
          '<li>Off-the-job position and a compliance calendar</li>' +
          '<li>A board report you can print</li>' +
        '</ul>' +

        '<div class="err" id="err" hidden></div>' +
        '<button class="btn" id="pay">Continue to payment</button>' +
        (sub && sub.stripe_customer_id ? '<button class="btn ghost" id="manage" style="margin-top:10px;width:100%">Manage billing</button>' : '') +

        '<p class="hint" style="margin-top:16px">Payment is taken by Stripe, so card details never touch this site. ' +
        'Cancel any time from your billing page.</p>' +

        '<div class="demo" style="margin-top:20px">' +
          '<button type="button" class="fill" id="out">Sign out</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById('pay').addEventListener('click', async () => {
    const b = document.getElementById('pay');
    b.disabled = true; b.textContent = 'Opening Stripe…';
    try { await startCheckout(); }
    catch(e){ fail(e.message); b.disabled = false; b.textContent = 'Continue to payment'; }
  });

  const manage = document.getElementById('manage');
  if(manage) manage.addEventListener('click', async () => {
    try { await openBilling(); } catch(e){ fail(e.message); }
  });

  document.getElementById('out').addEventListener('click', async () => {
    await signOut(); location.href = 'account.html';
  });
}

/* ---------- Wiring ---------- */

function fail(text){
  const e = document.getElementById('err');
  if(e){ e.textContent = text; e.hidden = false; }
}

function wire(view){
  /* Tell someone the password is too short while they type, not after they
     have pressed the button and lost the rest of the form to a reload. */
  const pw = document.getElementById('password');
  const pwnote = document.getElementById('pwnote');
  if(pw && pwnote && view === 'join'){
    pw.addEventListener('input', () => {
      const n = pw.value.length;
      if(n === 0){ pwnote.textContent = 'At least eight characters.'; pwnote.className = 'fieldnote'; }
      else if(n < 8){ pwnote.textContent = (8 - n) + ' more character' + (8 - n === 1 ? '' : 's') + ' needed.'; pwnote.className = 'fieldnote warn'; }
      else { pwnote.textContent = 'That will do.'; pwnote.className = 'fieldnote ok'; }
    });
  }

  const peek = document.getElementById('peek');
  if(peek) peek.addEventListener('click', () => {
    const p = document.getElementById('password'), shown = p.type === 'text';
    p.type = shown ? 'password' : 'text';
    peek.textContent = shown ? 'Show' : 'Hide';
    p.focus();
  });

  const jump = { toSignin: 'signin', toJoin: 'join', toForgot: 'forgot' };
  Object.keys(jump).forEach(id => {
    const b = document.getElementById(id);
    if(b) b.addEventListener('click', () => show(jump[id]));
  });

  const form = document.getElementById('form');
  if(!form) return;

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const go = document.getElementById('go');
    const was = go.textContent;
    go.disabled = true; go.textContent = 'Working…';
    document.getElementById('err').hidden = true;

    try {
      const email = (document.getElementById('email') || {}).value;
      const pass  = (document.getElementById('password') || {}).value;

      if(view === 'join'){
        if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) throw new Error('Enter a valid email address.');
        if(!pass || pass.length < 8) throw new Error('Passwords need at least eight characters.');
        await signUp(email.trim(), pass, document.getElementById('org').value.trim(),
                     document.getElementById('optout').checked);
        panel.innerHTML = '<div class="pagehead centred"><h1>Check your email</h1>' +
          '<p>We have sent a confirmation link to ' + email.trim() + '. ' +
          'Click it, then come back and sign in. If it does not arrive within a few minutes, check your spam folder.</p></div>';
        return;
      }

      if(view === 'signin'){
        await signIn(email.trim(), pass);
        const sub = await getSubscription();
        const profile = await getProfile();
        location.href = hasAccess(sub, profile) ? 'members.html' : 'account.html';
        return;
      }

      if(view === 'forgot'){
        await requestReset(email.trim());
        panel.innerHTML = '<div class="pagehead centred"><h1>Check your email</h1>' +
          '<p>If there is an account for ' + email.trim() + ', a reset link is on its way. It expires in an hour.</p></div>';
        return;
      }

      if(view === 'newpassword'){
        if(!pass || pass.length < 8) throw new Error('Passwords need at least eight characters.');
        await setPassword(pass);
        show('signin', 'Password changed. Sign in with the new one.');
        return;
      }

    } catch(err){
      fail(friendly(err.message));
      go.disabled = false; go.textContent = was;
    }
  });
}

/* Supabase errors are accurate but unhelpful to read. */
function friendly(m){
  const s = String(m || '');
  if(/Invalid login/i.test(s)) return 'That email and password do not match an account.';
  if(/already registered/i.test(s)) return 'There is already an account with that email. Try signing in.';
  if(/Email not confirmed/i.test(s)) return 'Confirm your email first — check for the link we sent.';
  if(/rate limit|too many/i.test(s)) return 'Too many attempts. Wait a minute and try again.';
  return s;
}

/* ---------- Not connected ---------- */

function notConnected(){
  return '<div class="pagehead centred"><h1>Accounts are not connected yet</h1>' +
    '<p>The code is here; the services are not plugged in.</p></div>' +
    '<div class="notice centred" style="max-width:640px"><b>What is missing.</b> ' +
    '<code>config.js</code> still has placeholder values. Create a Supabase project, paste the URL and anon key in, ' +
    'run <code>schema.sql</code>, and add the Stripe keys to Vercel. The setup guide walks through it. ' +
    'Until then the members page keeps working with its demo gate.</div>';
}

/* An async boot with no catch is how you end up looking at a blank page: the
   promise rejects, nothing is rendered, and the only trace is in the console.
   Show the failure instead. */
boot().catch(err => {
  console.error('account boot failed:', err);
  panel.innerHTML =
    '<div class="pagehead centred"><h1>Something went wrong</h1>' +
    '<p>The sign-in page could not start.</p></div>' +
    '<div class="alert centred" style="max-width:620px"><b>' + String(err && err.message || err) + '</b></div>' +
    '<div class="notice centred" style="max-width:620px">' +
    'Most often this is the Supabase URL or key in <code>config.js</code>, or a redirect URL that has not been ' +
    'added under Authentication → URL Configuration. Reload once first — a slow network can cause it too.</div>';
});

recordView();

</script>
